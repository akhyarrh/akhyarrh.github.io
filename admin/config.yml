backend:
  automatic_deployments: false
  name: github
  repo: akhyarrh/akhyarrh.github.io
  branch: source
  base_url: 'https://sveltia-cms-auth.akhyar.workers.dev/'

media_folder: '/assets/uploads'

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}.md"
    fields:
      - { label: "Published", name: "published", widget: "boolean" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Content", name: "body", widget: "markdown", options: { buttons: ["link"], modes: "raw" }}
  
  - name: "snippets"
    label: "Code Snippets"
    folder: "_snippets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Language", name: "language", widget: "select", options: ["javascript", "python", "css", "html", "ruby", "php", "java", "csharp", "cpp", "other"] }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Content", name: "body", widget: "markdown", options: { buttons: ["link", "code-block"], modes: "raw" }}
