name: Push to GitLab

on:
  push:
    branches: [source]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    #- uses: actions/checkout@v6
      #with:
        #fetch-depth: 0
    - uses: keninkujovic/gitlab-sync@2.1.3
      with:
        gitlab_url: ${{ env.GITLAB_REPO }}
        username: ${{ env.GITLAB_USER }}
        gitlab_pat: ${{ secrets.GITLAB_TOKEN }}
        
