<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {%- seo -%}
    {%- feed_meta -%}
    {%- include custom-head.html -%}
    
    <!-- Google Fonts: A clean, modern sans-serif font is best for this style. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 
         * =========================================
         * CSS STYLES
         * Expert: Web Designer / Front-End Developer
         * =========================================
         */

        /* --- 1. Global & Reset Styles --- */
        /* A common best practice to ensure consistent styling across all browsers. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- 2. Body & Background --- */
        body {
            font-family: 'Inter', sans-serif; /* Use the imported Google Font */
            color: #fff; /* Default text color is white */
            
            /* A subtle, professional gradient background */
            background: linear-gradient(135deg, #1c1e26, #3c3f50);
            
            /* Center the content vertically and horizontally */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensures the body takes at least the full viewport height */
            padding: 20px; /* Adds some space on very small screens */
        }

        /* --- 3. Main Container --- */
        /* This holds all the content and centers it. */
        .container {
            width: 100%;
            max-width: 680px; /* A good max-width for link pages */
            text-align: center;
            padding: 40px 20px;
        }
        
        /* --- 4. Profile Section --- */
        .profile-header {
            margin-bottom: 40px; /* Space between header and links */
        }
        
        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Makes the image a perfect circle */
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            object-fit: cover; /* Prevents the image from being distorted */
            margin-bottom: 20px;
        }

        .profile-title {
            font-size: 2rem; /* 32px */
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-description {
            font-size: 1rem; /* 16px */
            font-weight: 400;
            color: #d1d5db; /* A slightly softer white for the description */
        }

        /* --- 5. Fluid Buttons / Links --- */
        .links-container {
            display: flex;
            flex-direction: column; /* Stack the links vertically */
            gap: 20px; /* Space between each link button */
        }

        .link-button {
            display: block; /* Makes the entire area of the anchor tag clickable */
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none; /* Removes the default underline from links */
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 1.1rem; /* 17.6px */
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            /* The magic for the smooth "fluid" animation on hover */
            transition: all 0.3s ease-in-out;
        }

        .link-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05); /* Makes the button "grow" slightly */
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        /* --- 6. Footer --- */
        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <main class="container">
    <!-- PROFILE SECTION -->
        <header class="profile-header">
            <img src="/profile-picture.jpg" alt="Profile Picture" class="profile-picture">
            <h1 class="profile-title">Akhyar RH</h1>
            <p class="profile-description">Level 31. Male. Human.</p>
        </header>

        <!-- FLUID BUTTONS SECTION -->
        <div class="links-container">
            <a href="/blog/" class="link-button">/blog</a>
            <a href="https://twitter.com/akhyarrh" class="link-button">/twitter</a>
            <a href="https://github.com/akhyarrh" class="link-button">/github</a>
        </div>
        
        <footer>
            <p>&copy; 2026</p>
        </footer>

    </main>

</body>
