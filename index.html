---
layout: null
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    {%- feed_meta -%}
    {%- include custom-head.html -%}
    
    <!-- Load BRUTALIST theme CSS -->
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">

    <style>
        /* BRUTALIST LANDING PAGE - Layout overrides only */
        /* Global styles already defined in style.css */
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Profile header box */
        .profile-header {
            margin-bottom: 2rem;
            border: 5px solid var(--minima-border-color-01);
            padding: 30px;
            background-color: var(--minima-code-background-color);
            box-shadow: 10px 10px 0 var(--minima-border-color-01);
        }

        /* Square profile picture with hard shadow */
        .profile-picture {
            width: 150px;
            height: 150px;
            margin: 0 auto 1.5rem;
            display: block;
            border: 6px solid var(--minima-border-color-01);
            box-shadow: 8px 8px 0 var(--minima-border-color-01);
            object-fit: cover;
        }

        /* Profile title styling */
        .profile-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 4px solid var(--minima-border-color-01);
            padding-bottom: 10px;
            margin: 0 0 1rem 0;
            color: var(--minima-heading-color);
        }

        /* Profile description */
        .profile-description {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0;
            color: var(--minima-text-color);
        }

        /* Links container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Brutalist link buttons */
        .link-button {
            display: block;
            text-decoration: none;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            background-color: var(--minima-background-color);
            border: 5px solid var(--minima-border-color-01);
            color: var(--minima-link-base-color);
            box-shadow: 6px 6px 0 var(--minima-border-color-01);
            transition: none;
        }

        .link-button:hover {
            background-color: var(--minima-link-base-color);
            color: var(--minima-background-color);
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 var(--minima-border-color-01);
            text-decoration: none;
        }

        .link-button:active {
            transform: translate(6px, 6px);
            box-shadow: none;
        }

        /* Footer styling */
        footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--minima-brand-color-dimmed);
            border-top: 4px solid var(--minima-border-color-01);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- PROFILE SECTION -->
        <header class="profile-header">
            <img src="{{ '/assets/img/profile-picture.jpg' | relative_url }}" 
                 alt="Profile Picture" 
                 class="profile-picture">
            <h1 class="profile-title">{{ site.author.name }}</h1>
            <p class="profile-description">{{ site.description }}</p>
        </header>

        <!-- BUTTONS SECTION -->
        <div class="links-container">
            <a href="{{ '/blog' | relative_url }}" class="link-button">/blog</a>
            <a href="{{ '/twitter' | relative_url }}" class="link-button">/twitter</a>
            <a href="{{ '/github' | relative_url }}" class="link-button">/github</a>
        </div>
        
        <footer>
            <p>&copy; {{ site.time | date: '%Y' }}</p>
        </footer>
    </main>

</body>
</html>
